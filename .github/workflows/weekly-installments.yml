name: Обновление банковских ставок
on:
  schedule:
    # Ставки и комиссии: каждые три часа.
    - cron: '15 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: tools-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Проверить правила справочника
        run: |
          node tests/tools.test.mjs
          python3 tests/tools_source_test.py
      - name: Обновить только ставки ЧПВ из опубликованного снимка
        env:
          SUBSIDY_SOURCES: ${{ secrets.SUBSIDY_SOURCES }}
        run: python3 automation/sync_tools.py --mortgage-only
      - name: Сохранить снимок
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 automation/publish_tools.py
      # publish_tools также запрашивает сборку Pages и сообщает отдельно о её недоступности.
