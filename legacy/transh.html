<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Вход в калькулятор — Свобода мысли</title></head>
<body><p>Калькулятор переехал на защищённый сервер. Сейчас откроется страница входа.</p>
<p><a id="destination" rel="noreferrer" href="https://ipoteka-calc-evgeniieusew.mia0.amvera.tech/legacy/transh.html">Открыть калькулятор</a></p>
<script>
(() => {
  const target = new URL("https://ipoteka-calc-evgeniieusew.mia0.amvera.tech/");
  const incoming = new URLSearchParams(location.search);
  const routes = ['mortgage-standard', 'mortgage', 'installments', 'chpv', 'tranche', 'tools'];
  const aliases = {"rassrochka.html": "installments", "chpv.html": "chpv", "transh.html": "tranche", "tools.html": "tools"};
  const prefix = '/ipoteka-calc/legacy';
  let legacyPath = "legacy/transh.html";
  if (location.pathname === prefix || location.pathname.startsWith(prefix + '/')) {
    const tail = location.pathname.slice(prefix.length).replace(/^\//, '');
    const safe = tail.split('/').every(part => !part || (/^[A-Za-z0-9._-]+$/.test(part) && part !== '.' && part !== '..'));
    legacyPath = 'legacy/' + (safe ? tail : '');
  }
  const queryPage = incoming.get('page');
  if (legacyPath) {
    target.pathname = target.pathname.replace(/\/?$/, '/') + legacyPath;
    if (routes.includes(queryPage)) target.searchParams.set('page', queryPage);
  } else {
    const candidate = null || aliases[location.pathname.split('/').pop()];
    const alias = routes.includes(candidate) ? candidate : null;
    if (alias || routes.includes(queryPage)) target.searchParams.set('page', alias || queryPage);
  }
  const theme = incoming.get('theme');
  if (theme === 'light' || theme === 'dark') target.searchParams.set('theme', theme);
  document.getElementById('destination').href = target.href;
  location.replace(target.href);
})();
</script></body></html>
